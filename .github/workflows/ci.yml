name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  build:
    name: colcon build (ros:kilted)
    # There's no pytest suite in this repo yet, so this verifies the packages actually
    # build and pt_description's xacro processes cleanly - not a substitute for real tests,
    # but it catches broken XML/CMakeLists/xacro syntax before it reaches a robot.
    runs-on: ubuntu-latest
    container: ros:kilted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/pantilt_ros2

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ros-kilted-controller-manager \
            ros-kilted-forward-command-controller \
            ros-kilted-joint-state-broadcaster \
            ros-kilted-joy-teleop \
            ros-kilted-robot-state-publisher \
            ros-kilted-ros2-control \
            ros-kilted-xacro

      - name: colcon build
        run: |
          . /opt/ros/kilted/setup.sh
          colcon build --packages-select pt_description pt_control pt_bringup

      - name: xacro sanity check
        run: |
          . /opt/ros/kilted/setup.sh
          . install/setup.sh
          xacro src/pantilt_ros2/pt_description/urdf/pantilt.urdf.xacro > /dev/null

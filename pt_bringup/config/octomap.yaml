# Builds a persistent 3D octree from /oak/rgbd/points (raw, uncompressed). Only relevant when
# pointcloud:=true and octomap:=true - the cloud doesn't exist otherwise.
/octomap_server:
  ros__parameters:
    frame_id: odom              # world frame the octree is built in
    base_frame_id: base_footprint
    resolution: 0.05            # octree leaf size, meters
    filter_ground_plane: false
    sensor_model:
      max_range: 4.0  # matches depth_to_scan's range_max
    latch: false  # subscriber-gated outputs instead of publishing on every update regardless

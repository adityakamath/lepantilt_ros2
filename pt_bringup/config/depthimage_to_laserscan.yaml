# depthimage_to_laserscan: slices a row-band from the OAK-D depth image into a 2D LaserScan.
# Runs in both pointcloud:=true and pointcloud:=false modes — it only needs the depth Image +
# CameraInfo that the driver always publishes, no point cloud required.
/depth_to_scan:
  ros__parameters:
    scan_height: 1        # rows sampled, centered vertically; widen if signal is noisy
    range_min: 0.45
    range_max: 4.0         # conservative vs. driver default 10.0 - stereo depth gets sparse/noisy at range
    output_frame: "oak_rgb_camera_frame"

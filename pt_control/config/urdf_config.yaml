serial_port: /dev/ttySERVO
baud_rate: 1000000

use_mock: false
use_sync_write: true

sts3215_max_vel_steps: 3400
proportional_vel_max: 0

# Motor IDs, step-centering, and joint limits are not here - they're physical-calibration
# constants for this mechanism, baked directly into pantilt.joints.xacro's macro defaults
# (single source of truth), the same way so101.control.xacro/so100.control.xacro in
# so_arm_ros2 hardcode motor IDs/joint limits rather than sourcing them from an external
# launch-time YAML.
